name: MinnaDich
options:
  bundleIdPrefix: com.minnadich
  createIntermediateGroups: true
targets:
  MinnaDich:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MinnaDich
        excludes:
          - "**/Info.plist"
    info:
      path: MinnaDich/Resources/Info.plist
    settings:
      base:
        PRODUCT_NAME: "MinnaDich"
        PRODUCT_BUNDLE_IDENTIFIER: com.minnadich.app
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""
        ENABLE_BITCODE: "NO"
schemes:
  MinnaDich:
    build:
      targets:
        MinnaDich: all
    archive:
      config: Release
