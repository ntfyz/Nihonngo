name: MinnaDich
options:
  bundleIdPrefix: com.minnadich
  createIntermediateGroups: true
  xcodeVersion: "15.0"
targets:
  MinnaDich:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MinnaDich
    settings:
      base:
        PRODUCT_NAME: "Minna Dịch"
        PRODUCT_BUNDLE_IDENTIFIER: com.minnadich.app
        INFOPLIST_FILE: MinnaDich/Resources/Info.plist
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""
        ENABLE_BITCODE: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
