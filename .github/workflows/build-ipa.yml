name: Build Unsigned IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build Archive (Unsigned)
        run: |
          xcodebuild archive \
            -project MinnaDich.xcodeproj \
            -scheme MinnaDich \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/MinnaDich.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload to Unsigned IPA
        run: |
          mkdir -p Payload
          # Copy .app inside the archive products into Payload/
          cp -r build/MinnaDich.xcarchive/Products/Applications/*.app Payload/
          
          # Create unsigned IPA package
          zip -r -y MinnaDich-unsigned.ipa Payload
          
          ls -lh MinnaDich-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinnaDich-unsigned-ipa
          path: MinnaDich-unsigned.ipa
          retention-days: 14
