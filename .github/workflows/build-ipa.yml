name: Build Unsigned IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Xcode Version
        run: |
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build Archive (Unsigned)
        run: |
          xcodebuild archive \
            -project MinnaDich.xcodeproj \
            -scheme MinnaDich \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/MinnaDich.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload to Unsigned IPA
        run: |
          mkdir -p Payload
          # Copy .app from xcarchive to Payload
          APP_PATH=$(find build/MinnaDich.xcarchive/Products/Applications -name "*.app" -maxdepth 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          
          # Zip into unsigned IPA
          zip -r -y MinnaDich-unsigned.ipa Payload
          ls -lh MinnaDich-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinnaDich-unsigned-ipa
          path: MinnaDich-unsigned.ipa
          retention-days: 14
