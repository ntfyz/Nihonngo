name: Build Unsigned IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Xcode Version
        run: |
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build Application (Unsigned)
        run: |
          xcodebuild clean build \
            -project MinnaDich.xcodeproj \
            -scheme MinnaDich \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload to Unsigned IPA
        run: |
          mkdir -p Payload
          
          # Tìm file .app đã build xong
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          echo "Tìm thấy file app tại: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "Lỗi: Không tìm thấy file .app!"
            exit 1
          fi
          
          # Copy .app vào thư mục Payload/
          cp -r "$APP_PATH" Payload/
          
          # Đóng gói Payload thành .ipa unsigned
          zip -r -y MinnaDich-unsigned.ipa Payload
          ls -lh MinnaDich-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinnaDich-unsigned-ipa
          path: MinnaDich-unsigned.ipa
          retention-days: 14
